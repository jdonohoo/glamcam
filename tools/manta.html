<!-- Source for props/sprites/manta-0..7.png: 8 flap frames; crop all frames with one shared bounding box. -->
<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}.p{display:inline-block;padding:24px}</style></head><body>
<div id="frames"></div>
<script>
// A small neon manta, facing right, seen a little from above and to the side.
// Frame k of 8: both wingtips swing together (that's how mantas flap).
const NS = 'http://www.w3.org/2000/svg';
for (let k = 0; k < 8; k++) {
  const s = Math.sin(k / 8 * 2 * Math.PI);           // -1..1 flap
  const wrap = document.createElement('div'); wrap.className = 'p'; wrap.id = 'f' + k;
  wrap.innerHTML = `<svg width="300" height="260" viewBox="-150 -130 300 260">
   <defs><filter id="g${k}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   <path d="M-58,4 Q-100,8 -140,0" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#g${k})"/>
   <path d="M62,-6 Q30,${-18 - 6 * s} 6,${-30 - 10 * s} Q-20,${-78 - 38 * s} -10,${-104 - 52 * s}
            Q-34,${-70 - 30 * s} -60,-6 L-62,6
            Q-34,${50 - 24 * s} -12,${80 - 44 * s} Q-24,${56 - 30 * s} 4,${26 - 10 * s} Q30,${16 - 6 * s} 62,6 Z"
         fill="#1C0F3A" stroke="#00F0FF" stroke-width="4" stroke-linejoin="round" filter="url(#g${k})"/>
   <path d="M-6,${-60 - 30 * s} Q-20,${-40 - 18 * s} -40,-8" fill="none" stroke="#FF5FD2" stroke-width="3" opacity=".9"/>
   <path d="M-8,${58 - 30 * s} Q-22,${36 - 16 * s} -40,8" fill="none" stroke="#FF5FD2" stroke-width="3" opacity=".9"/>
   <ellipse cx="10" cy="0" rx="34" ry="12" fill="#E8FBFF" opacity=".85"/>
   <path d="M60,-6 Q74,-16 70,-28" fill="none" stroke="#9BF7FF" stroke-width="5" stroke-linecap="round" filter="url(#g${k})"/>
   <path d="M60,6 Q74,16 70,28" fill="none" stroke="#9BF7FF" stroke-width="5" stroke-linecap="round" filter="url(#g${k})"/>
   <circle cx="50" cy="-9" r="3.5" fill="#FFE95A"/>
  </svg>`;
  document.getElementById('frames').appendChild(wrap);
}
</script></body></html>
