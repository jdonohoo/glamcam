<!-- Source for the neon props in props/. Render each #id element to a transparent PNG
     (e.g. Playwright: element.screenshot({omitBackground: true})) and crop to its bounding box. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@700&display=block');
body{margin:0;background:transparent}
.p{display:inline-block;padding:50px;position:relative}
/* 1: Onboard neon sign */
#onboard .txt{font-family:'Pacifico';font-size:150px;line-height:1;color:#FFEAF8;padding:10px 40px 30px;
 text-shadow:0 0 4px #fff,0 0 10px #FF5FD2,0 0 24px #FF5FD2,0 0 48px #FF5FD2,0 0 90px #FF5FD2}
#onboard .frame{border:6px solid #CFFFFF;border-radius:46px;box-shadow:0 0 8px #00F0FF,0 0 22px #00F0FF,0 0 50px #00F0FF,inset 0 0 22px #00F0FF88}
#onboard .est{position:absolute;right:110px;bottom:62px;font-family:'Space Grotesk';font-size:26px;letter-spacing:6px;color:#FFFBE0;
 text-shadow:0 0 6px #FFE95A,0 0 16px #FFE95A}
/* 4: sucks to suck */
#sucks .panes{display:grid;grid-template-columns:150px 150px;gap:18px;transform:perspective(600px) rotateY(-18deg);margin:10px auto 0;width:318px}
#sucks .panes div{height:150px;border:6px solid #DFFFFF;border-radius:6px;box-shadow:0 0 8px #00F0FF,0 0 22px #00F0FF,0 0 46px #00F0FF,inset 0 0 26px #00F0FF99}
#sucks .txt{font-family:'Pacifico';font-size:76px;color:#FFEAF8;text-align:center;margin-top:18px;transform:rotate(-6deg);
 text-shadow:0 0 4px #fff,0 0 10px #FF3B6B,0 0 24px #FF3B6B,0 0 50px #FF3B6B}
</style></head><body>
<div class="p" id="onboard"><div class="frame"><div class="txt">Onboard</div></div><div class="est">EST. A WHILE AGO</div></div><br>
<div class="p" id="disco"><svg width="300" height="560" viewBox="0 0 300 560"></svg></div><br>
<div class="p" id="keyboard"><svg width="760" height="330" viewBox="0 0 760 330"></svg></div><br>
<div class="p" id="sucks"><div class="panes"><div></div><div></div><div></div><div></div></div><div class="txt">sucks to suck</div></div>
<script>
// disco ball: mirror tiles in latitude bands, shaded like a sphere, hanging from a string
(() => {
  const svg = document.querySelector('#disco svg'), NS = 'http://www.w3.org/2000/svg', cx = 150, cy = 380, R = 130;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const defs = el('defs', {});
  defs.innerHTML = `<clipPath id="c"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
   <radialGradient id="shade" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".65" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
   <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  el('rect', {x: cx - 2, y: 0, width: 4, height: cy - R, fill: '#DFFFFF', filter: 'url(#g)'});  // a line has a zero-width box, which kills the glow filter
  const g = el('g', {'clip-path': 'url(#c)'});
  const colors = ['#E8E8F0', '#C9C9D6', '#FFFFFF', '#FF9BE6', '#9BF7FF', '#B9A6FF', '#FFF4A0', '#8E8EA0'];
  for (let lat = -90; lat < 90; lat += 10) {
    const y0 = cy + R * Math.sin(lat * Math.PI / 180), y1 = cy + R * Math.sin((lat + 10) * Math.PI / 180);
    const w = 2 * R * Math.cos((lat + 5) * Math.PI / 180), n = Math.max(2, Math.round(w / 18));
    for (let i = 0; i < n; i++) {
      const x = cx - w / 2 + i * w / n;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x + 1); r.setAttribute('y', y0 + 1); r.setAttribute('width', w / n - 2); r.setAttribute('height', y1 - y0 - 2);
      r.setAttribute('fill', colors[Math.floor(rnd() * colors.length)]); g.appendChild(r);
    }
  }
  el('circle', {cx, cy, r: R, fill: 'url(#shade)'});
  el('circle', {cx, cy, r: R, fill: 'none', stroke: '#FF5FD2', 'stroke-width': 4, filter: 'url(#g)'});
  const star = (x, y, s, c) => el('path', {d: `M${x},${y - s} L${x + s * .22},${y - s * .22} L${x + s},${y} L${x + s * .22},${y + s * .22} L${x},${y + s} L${x - s * .22},${y + s * .22} L${x - s},${y} L${x - s * .22},${y - s * .22}Z`, fill: c, filter: 'url(#g)'});
  star(105, 330, 26, '#fff'); star(205, 300, 16, '#9BF7FF'); star(60, 470, 18, '#FF9BE6'); star(250, 450, 22, '#FFF4A0');
})();
// floating keyboard: neon outline, a few keys lit
(() => {
  const svg = document.querySelector('#keyboard svg'), NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const defs = el('defs', {});
  defs.innerHTML = `<filter id="kg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  const g = el('g', {transform: 'translate(380 165) skewX(-18) scale(1 .62) translate(-340 -150)', filter: 'url(#kg)'});
  el('rect', {x: 0, y: 0, width: 680, height: 300, rx: 26, fill: '#140A2E', 'fill-opacity': .55, stroke: '#00F0FF', 'stroke-width': 6}, g);
  const rows = [14, 14, 13, 12];
  const lit = new Set(['0,3', '1,1', '1,2', '1,3', '2,6', '3,9']);
  rows.forEach((n, r) => {
    const kw = 640 / 14, off = 20 + (14 - n) * kw / 2;
    for (let i = 0; i < n; i++) {
      el('rect', {x: off + i * kw + 3, y: 22 + r * 56, width: kw - 6, height: 46, rx: 8, fill: 'none',
        stroke: lit.has(`${r},${i}`) ? '#FF5FD2' : '#9BF7FF', 'stroke-width': lit.has(`${r},${i}`) ? 5 : 3}, g);
    }
  });
  el('rect', {x: 200, y: 246, width: 280, height: 40, rx: 8, fill: 'none', stroke: '#FFE95A', 'stroke-width': 4}, g);
})();
</script></body></html>
