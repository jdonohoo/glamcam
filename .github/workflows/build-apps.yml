name: Build apps

on:
  push:
    branches: [master, glamcam-v1]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            artifact: GlamCam-macOS-AppleSilicon
          - os: windows-latest
            artifact: GlamCam-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python glamcam.py --download-models
      - name: Build
        run: python -m PyInstaller --noconfirm --log-level WARN glamcam.spec

      - name: Self-test and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/GlamCam.app/Contents/MacOS/GlamCam --self-test
          ditto -c -k --keepParent dist/GlamCam.app ${{ matrix.artifact }}.zip
      - name: Self-test and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\GlamCam\GlamCam.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path dist\GlamCam -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # Publishes a GitHub Release with the zips when VERSION names a version that has no tag yet
  # (bump VERSION to ship), or when a v* tag is pushed. Ordinary pushes just build.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$tag is already released; bump VERSION to publish a new one."
            fi
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          path: dl
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GlamCam ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: dl/*.zip
